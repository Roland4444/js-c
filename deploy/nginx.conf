# Include inside an existing HTTPS server block for the calculator domain.
# Configure TLS certificates in that server block.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    # Do not add X-Frame-Options DENY/SAMEORIGIN: Bitrix uses an iframe.
    # Avoid logging session query parameters.
    access_log off;
}
